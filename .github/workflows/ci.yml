name: CI

on:
  push:
    branches: [main, ui-next]
  pull_request:

jobs:
  test:
    name: Test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - name: Extension tests
        run: node --test extension/test/*.test.js
      - run: go test ./...
      - name: Build CLI
        run: CGO_ENABLED=0 go build -o /tmp/odm ./cmd/odm

  gui:
    name: Windows (desktop UI)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/gui/frontend/package-lock.json
      - name: Page tests and build
        working-directory: internal/gui/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - run: go vet -tags gui ./internal/gui/ ./internal/ui/ ./cmd/odm
      - run: go test -tags gui ./internal/gui/ ./internal/i18n/
      - name: Build ODM.exe
        run: |
          CGO_ENABLED=0 go build -tags gui,production -trimpath -ldflags "-s -w -H=windowsgui" \
            -o dist/ODM.exe ./cmd/odm
      - uses: actions/upload-artifact@v4
        with:
          name: ODM-windows-amd64.exe
          path: dist/ODM.exe

  # The Fyne UI: what Linux and macOS ship, and on Windows a build kept
  # working (./scripts/build.sh windows-fyne).
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: odm-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: odm-linux-arm64
          - os: macos-latest
            artifact: odm-darwin-arm64
          - os: windows-latest
            artifact: ODM-fyne-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable # macos-latest (macOS 26) failed to link with Go 1.23
          cache: true

      - name: Install Linux GL/X11 deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y

      - name: Build desktop UI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
              go build -tags fyne -trimpath -ldflags "-s -w -H=windowsgui" \
              -o "dist/${{ matrix.artifact }}" ./cmd/odm
          else
            CGO_ENABLED=1 go build -tags fyne -trimpath -ldflags "-s -w" \
              -o "dist/${{ matrix.artifact }}" ./cmd/odm
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
