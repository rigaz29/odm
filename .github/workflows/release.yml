name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            goos: linux
            goarch: amd64
            name: odm
          - os: ubuntu-24.04-arm
            label: linux-arm64
            goos: linux
            goarch: arm64
            name: odm
          - os: macos-latest
            label: darwin-arm64
            goos: darwin
            goarch: arm64
            name: odm
          # Intel Macs: cross-compiled on the arm64 runner; Apple's clang and
          # SDK build x86_64 with -arch.
          - os: macos-latest
            label: darwin-amd64
            goos: darwin
            goarch: amd64
            name: odm
          - os: windows-latest
            label: windows-amd64
            goos: windows
            goarch: amd64
            name: ODM.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable # macos-latest (macOS 26) failed to link with Go 1.23
          cache: true

      - name: Install Linux GL/X11 deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # Windows ships the desktop UI of internal/gui (docs/GUI.md): its page
      # is built first and embedded in the exe.
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/gui/frontend/package-lock.json

      - name: Build the page (Windows)
        if: runner.os == 'Windows'
        working-directory: internal/gui/frontend
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X odm/internal/version.Version=${VERSION}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # The desktop UI of internal/gui: no cgo.
            CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} \
              go build -tags gui -trimpath -ldflags "${LDFLAGS} -H=windowsgui" \
              -o "dist/${{ matrix.name }}" ./cmd/odm
          else
            # Linux and macOS: the Fyne UI, with cgo.
            if [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
              export CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64"
            fi
            CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -tags fyne -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/${{ matrix.name }}" ./cmd/odm
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p stage
          cp "dist/${{ matrix.name }}" stage/
          cp README.md LICENSE stage/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Git Bash on the Windows runner has no zip; PowerShell does.
            pwsh -NoProfile -Command "Compress-Archive -Path stage/* -DestinationPath 'odm-${{ matrix.label }}.zip'"
          else
            tar -czf "odm-${{ matrix.label }}.tar.gz" -C stage .
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: odm-${{ matrix.label }}.*
          # Every matrix job uploads to the same release, and each one that
          # asks for generated notes appends another copy, so only one does.
          generate_release_notes: ${{ matrix.label == 'linux-amd64' }}
          # Tags like v0.1.0-rc1 publish as pre-releases, which the in-app
          # update check (releases/latest) does not offer.
          prerelease: ${{ contains(github.ref_name, '-') }}

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Package
        run: go run ./cmd/extpack -src extension -out dist/extension -version "${GITHUB_REF_NAME}"

      # AMO accepts each add-on version once, and an rc tag and its final tag
      # share the same numeric extension version, so only final tags are
      # signed. Pre-releases ship the unsigned .xpi (Firefox Developer
      # Edition / Nightly). Without credentials the release still completes.
      - name: Sign for Firefox (unlisted)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO credentials are not set; shipping the unsigned .xpi"
            exit 0
          fi
          npx --yes web-ext@10.7.0 sign --channel=unlisted \
            --source-dir dist/extension/firefox --artifacts-dir dist/extension/signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv dist/extension/signed/*.xpi dist/extension/odm-extension-firefox.xpi
          rm dist/extension/odm-extension-firefox-unsigned.xpi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/extension/odm-extension-*
          prerelease: ${{ contains(github.ref_name, '-') }}
