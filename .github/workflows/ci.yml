name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - name: Extension tests
        run: node --test extension/test/*.test.js
      - run: go test ./...
      # ODM's torrent tests (internal/torrent) run the newest odm-libtorrent
      # release of its protocol, as people get it. The program's own tests
      # (helper/libtorrent) run in odm-libtorrent.yml, on what it builds.
      - name: Torrent tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            -q '[.[] | select(.tagName | startswith("odm-libtorrent-p1-"))][0].tagName')
          if [ -z "$tag" ]; then
            echo "no odm-libtorrent release"
            exit 0
          fi
          echo "$tag"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p odm-libtorrent-linux-amd64.tar.gz -D "$RUNNER_TEMP/lt"
          tar -xzf "$RUNNER_TEMP/lt/odm-libtorrent-linux-amd64.tar.gz" -C "$RUNNER_TEMP/lt"
          ODM_LIBTORRENT="$RUNNER_TEMP/lt/odm-libtorrent" go test -count=1 -v ./internal/torrent/
      - name: Build CLI
        run: CGO_ENABLED=0 go build -o /tmp/odm ./cmd/odm

  gui:
    name: Windows (desktop UI)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/gui/frontend/package-lock.json
      - name: Page tests and build
        working-directory: internal/gui/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - run: go vet -tags gui ./internal/gui/ ./internal/ui/ ./cmd/odm
      - run: go test -tags gui ./internal/gui/ ./internal/i18n/
      - name: Build ODM.exe
        run: |
          CGO_ENABLED=0 go build -tags gui,production -trimpath -ldflags "-s -w -H=windowsgui" \
            -o dist/ODM.exe ./cmd/odm
      - uses: actions/upload-artifact@v4
        with:
          name: ODM-windows-amd64.exe
          path: dist/ODM.exe

  # The desktop UI on Linux (GTK 4, WebKitGTK 6.0) and macOS, built as the
  # releases build it. Intel Macs are cross-compiled on the arm64 runner,
  # so only the native builds run the tests.
  gui-unix:
    name: Desktop UI (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: darwin-arm64
          - os: macos-latest
            label: darwin-amd64
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/gui/frontend/package-lock.json
      - name: Install GTK 4 and WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Page build
        working-directory: internal/gui/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - if: ${{ !matrix.cross }}
        run: go vet -tags gui ./internal/gui/ ./internal/ui/ ./cmd/odm
      - if: ${{ !matrix.cross }}
        run: go test -tags gui ./internal/gui/ ./internal/i18n/
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64"
          fi
          CGO_ENABLED=1 go build -tags gui,production -trimpath -ldflags "-s -w" \
            -o "dist/odm-${{ matrix.label }}" ./cmd/odm
      - uses: actions/upload-artifact@v4
        with:
          name: odm-${{ matrix.label }}
          path: dist/odm-${{ matrix.label }}

  # The Fyne UI, the previous one: what Linux without WebKitGTK 6.0 ships,
  # built on Ubuntu 22.04 as the releases build it, and elsewhere a build
  # kept working (./scripts/build.sh linux-fyne, darwin-fyne, windows-fyne).
  desktop:
    name: Fyne UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: odm-fyne-linux-amd64
          - os: ubuntu-22.04-arm
            artifact: odm-fyne-linux-arm64
          - os: macos-latest
            artifact: odm-fyne-darwin-arm64
          - os: windows-latest
            artifact: ODM-fyne-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable # macos-latest (macOS 26) failed to link with Go 1.23
          cache: true

      - name: Install Linux GL/X11 deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y

      - name: Build desktop UI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
              go build -tags fyne -trimpath -ldflags "-s -w -H=windowsgui" \
              -o "dist/${{ matrix.artifact }}" ./cmd/odm
          else
            CGO_ENABLED=1 go build -tags fyne -trimpath -ldflags "-s -w" \
              -o "dist/${{ matrix.artifact }}" ./cmd/odm
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
